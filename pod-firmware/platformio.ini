; ATOM Echo pod firmware — PlatformIO project.
;
; Hardware: M5Stack ATOM Echo (ESP32-PICO-D4)
;   Mic  : SPM1423 PDM  — CLK G33 / DATA G23
;   Spk  : NS4168  I2S  — DATA G22 / BCLK G19 / LRCK G33
;   LED  : SK6812  — DATA G27
;   Btn  : G39
;
; Prerequisites:
;   pip install platformio            (or install the VS Code PlatformIO extension)
;
; Flash:
;   Connect ATOM Echo via USB-C, then:
;     pio run -t upload
;   (or from repo root: .\scripts\pod-push.ps1)
;
; See also: docs/deployment/m5stack-pod.md, docs/network/wifi-configuration.md

[env:atom_echo]
platform       = espressif32
board          = m5stack-atom
framework      = arduino

; Uncomment and set your COM port if auto-detect fails:
; upload_port    = COM3
; monitor_port   = COM3

monitor_speed  = 115200
build_flags    =
    -DARDUINO_M5Stack_ATOM
    -DBOARD_HAS_PSRAM

lib_deps =
    ; WebSocket client (small, no TLS needed for LAN)
    links2004/WebSockets @ ^2.4.1
    ; ArduinoJson for JSON protocol messages
    bblanchon/ArduinoJson @ ^7.2.1
    ; NeoPixel for SK6812 RGBW LED (FastLED has RMT conflicts on this board)
    adafruit/Adafruit NeoPixel @ ^1.12.3
    ; ESP-IDF I2S driver is part of the Arduino ESP32 core — no extra dep needed.

; Partition table: default (4 MB flash, 1.25 MB app)
board_build.partitions = default.csv
