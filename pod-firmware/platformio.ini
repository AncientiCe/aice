; Room pod firmware — PlatformIO project.
;
; Hardware: Waveshare ESP32-S3-AUDIO-Board (ESP32-S3R8, 8 MB octal PSRAM, 16 MB flash)
;   Codecs : ES8311 DAC (speaker), ES7210 4-channel ADC (2 mics + playback reference)
;   I/O    : TCA9555 expander (amp enable, 3 buttons), 7 × WS2812 LEDs on G38
;   Pin map: src/board.cpp
;
; Prerequisites:
;   pip install platformio            (or install the VS Code PlatformIO extension)
;
; Flash:
;   Connect the board via USB-C, then:
;     pio run -t upload
;   (or from repo root: .\scripts\pod-push.ps1)
;
; See also: docs/deployment/pod.md, docs/network/wifi-configuration.md

[env:waveshare_audio]
platform       = espressif32
board          = esp32-s3-devkitc-1
framework      = arduino

; Uncomment and set your COM port if auto-detect fails:
; upload_port    = COM3
; monitor_port   = COM3

monitor_speed  = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; Two 6.5 MB app slots for signed updates.
board_build.partitions = default_16MB.csv
build_flags    =
    -DBOARD_HAS_PSRAM
    ; Serial log over the board's native USB port.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    ; WebSocket client; WSS to the room bridge with the property CA
    links2004/WebSockets @ ^2.4.1
    ; ArduinoJson for JSON protocol messages
    bblanchon/ArduinoJson @ ^7.2.1
    ; NeoPixel for the WS2812 LED ring
    adafruit/Adafruit NeoPixel @ ^1.12.3
    ; ES8311 / ES7210 register drivers: lib/esp_codec_dev (vendored, Apache-2.0)
