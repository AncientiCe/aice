[package]
name = "core-orchestrator"
version = "0.1.0"
edition = "2021"
description = "Conversation state machine, barge-in, routing"

[dependencies]
tokio = { version = "1", features = ["sync", "time", "macros"] }
async-trait = "0.1"
futures = "0.3"
core-config = { path = "../core-config" }
core-observability = { path = "../core-observability" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"

[dev-dependencies]
core-search = { path = "../core-search" }

