[package]
name = "property-facilitator"
version = "0.1.0"
edition = "2021"
description = "On-prem property MCP facilitator for hotels, care homes, and wards"

[dependencies]
bytes = "1"
core-observability = { path = "../core-observability" }
core-policy = { path = "../core-policy" }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
