[package]
name = "core-llm"
version = "0.1.0"
edition = "2021"
description = "Ollama streaming LLM client and tool hooks"

[dependencies]
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
core-observability = { path = "../core-observability" }
core-orchestrator = { path = "../core-orchestrator" }
futures-util = "0.3"
