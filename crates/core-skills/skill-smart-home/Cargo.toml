[package]
name = "skill-smart-home"
version = "0.1.0"
edition = "2021"
description = "Smart home skill: lights, climate, scenes, device control"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
