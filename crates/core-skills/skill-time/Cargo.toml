[package]
name = "skill-time"
version = "0.1.0"
edition = "2021"
description = "Time skill: current time at a location (optional; default = current location)"

[dependencies]
async-trait = "0.1"
chrono = "0.4"
chrono-tz = "0.10"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
skill-weather = { path = "../skill-weather" }
thiserror = "1.0"
