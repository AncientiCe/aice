[package]
name = "skill-screenshot"
version = "0.1.0"
edition = "2021"
description = "Screenshot skill: take and save local macOS screenshots"

[dependencies]
async-trait = "0.1"
thiserror = "1.0"
metrics = "0.21"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
