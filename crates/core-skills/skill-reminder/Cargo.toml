[package]
name = "skill-reminder"
version = "0.1.0"
edition = "2021"
description = "Reminder skill: create macOS Reminders entries with optional due date"

[dependencies]
async-trait = "0.1"
thiserror = "1.0"
metrics = "0.21"
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
