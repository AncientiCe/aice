[package]
name = "skill-media"
version = "0.1.0"
edition = "2021"
description = "Media orchestration skill: playback, multi-room, source selection"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json"] }
metrics = "0.21"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
