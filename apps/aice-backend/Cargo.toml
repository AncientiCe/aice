[package]
name = "aice-backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "aice_backend"
path = "src/lib.rs"

[[bin]]
name = "aice-backend"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }
mdns-sd = "0.11"
core-config = { path = "../../crates/core-config" }
core-llm = { path = "../../crates/core-llm" }
core-observability = { path = "../../crates/core-observability" }
core-orchestrator = { path = "../../crates/core-orchestrator" }
core-runtime-protocol = { path = "../../crates/core-runtime-protocol" }
core-skills = { path = "../../crates/core-skills" }

[dev-dependencies]
