[package]
name = "aice-backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "aice_backend"
path = "src/lib.rs"

[[bin]]
name = "aice-backend"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"
tokio-tungstenite = "0.24"
futures-util = "0.3"
core-config = { path = "../../crates/core-config" }
core-tls = { path = "../../crates/core-tls" }
core-llm = { path = "../../crates/core-llm" }
core-observability = { path = "../../crates/core-observability" }
core-orchestrator = { path = "../../crates/core-orchestrator" }
core-runtime-protocol = { path = "../../crates/core-runtime-protocol" }
core-vad = { path = "../../crates/core-vad" }
property-facilitator = { path = "../../crates/property-facilitator" }
thiserror = "1.0"
core-stt = { path = "../../crates/core-stt", features = ["whisper"] }
core-skills = { git = "ssh://git@github.com/AncientiCe/aice-skills.git", rev = "ccf156ce4b4f9c95ce65b5f1c367c90ca6bb22c5", default-features = false, features = ["core-common", "hotel"] }
skill-chain = { git = "ssh://git@github.com/AncientiCe/aice-skills.git", rev = "ccf156ce4b4f9c95ce65b5f1c367c90ca6bb22c5" }
palace = { git = "ssh://git@github.com/AncientiCe/palace-rs.git", tag = "v0.14.2", package = "palace-rs", default-features = false }

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
