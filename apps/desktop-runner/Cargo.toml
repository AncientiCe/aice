[package]
name = "desktop-runner"
version = "0.1.0"
edition = "2021"
description = "Local voice assistant desktop runtime"
default-run = "desktop-runner"

[[bin]]
name = "desktop-runner"
path = "src/main.rs"

[[bin]]
name = "pod-voice"
path = "src/bin/pod-voice.rs"

[lib]
name = "desktop_runner"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
futures = "0.3"
chrono = { version = "0.4", features = ["clock"] }
core-config = { path = "../../crates/core-config" }
core-observability = { path = "../../crates/core-observability" }
core-orchestrator = { path = "../../crates/core-orchestrator" }
core-policy = { path = "../../crates/core-policy" }
core-search = { path = "../../crates/core-search" }
core-skills = { path = "../../crates/core-skills" }
core-stt = { path = "../../crates/core-stt", features = ["whisper"] }
core-llm = { path = "../../crates/core-llm" }
core-tts = { path = "../../crates/core-tts" }
core-vad = { path = "../../crates/core-vad" }
core-audio = { path = "../../crates/core-audio" }
pod-gateway = { path = "../pod-gateway" }
pod-protocol = { path = "../../crates/pod-protocol" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
ctrlc = "3"

[dev-dependencies]
async-trait = "0.1"
core-config = { path = "../../crates/core-config" }
core-orchestrator = { path = "../../crates/core-orchestrator" }
core-search = { path = "../../crates/core-search" }
core-skills = { path = "../../crates/core-skills" }
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
tempfile = "3"
serial_test = "3"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
