[package]
name = "aice-macos"
# Deprecated: do not extend or ship new functionality in this application.
version = "0.1.0"
edition = "2021"

[lib]
name = "aice_macos"
path = "src/lib.rs"

[[bin]]
name = "aice-macos"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tracing = "0.1"
core-audio = { path = "../../crates/core-audio" }
core-config = { path = "../../crates/core-config" }
core-observability = { path = "../../crates/core-observability" }
core-orchestrator = { path = "../../crates/core-orchestrator" }
core-runtime-protocol = { path = "../../crates/core-runtime-protocol" }
core-skills = { git = "ssh://git@github.com/AncientiCe/aice-skills.git", rev = "7e98d6ab38fad4f5f7772693de7e7e0b51a46af4" }
core-stt = { path = "../../crates/core-stt", features = ["whisper"] }
core-tts = { path = "../../crates/core-tts" }
core-vad = { path = "../../crates/core-vad" }

[dev-dependencies]
aice-backend = { path = "../aice-backend" }


