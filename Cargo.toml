[workspace]
resolver = "2"
members = [
    "crates/core-audio",
    "crates/core-vad",
    "crates/core-stt",
    "crates/core-llm",
    "crates/core-tts",
    "crates/core-orchestrator",
    "crates/core-config",
    "crates/core-observability",
    "crates/core-policy",
    "crates/core-search",
    "crates/core-runtime-protocol",
    "crates/pod-protocol",
    "apps/desktop-runner",
    "apps/aice-backend",
    "apps/aice-macos",
    "apps/pod-gateway",
]

# Local development: clone aice-skills as a sibling directory and uncomment
# the patch below to use local sources instead of the git dependency.
# [patch."ssh://git@github.com/AncientiCe/aice-skills.git"]
# core-skills = { path = "../aice-skills" }

# Local development: clone mempalace-rs as a sibling directory and uncomment
# the patch below to use local sources instead of the git dependency.
[patch."ssh://git@github.com/AncientiCe/mempalace-rs.git"]
mempalace = { path = "../mempalace-rs" }

