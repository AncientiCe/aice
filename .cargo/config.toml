[alias]
aice-pod-voice = "run -p desktop-runner --bin pod-voice"
aice-desktop = "run -p desktop-runner --bin desktop-runner"
aice-gateway = "run -p pod-gateway --bin pod-gateway"
aice-fmt = "fmt --all -- --check"
aice-clippy = "clippy --all-targets -- -D warnings"
aice-audit = "audit --deny warnings"
aice-test = "test --all"
