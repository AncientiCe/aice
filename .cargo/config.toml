[net]
git-fetch-with-cli = true

[alias]
aice-backend = 'run -p aice-backend --bin aice-backend'
aice-gateway = 'run -p pod-gateway --bin pod-gateway'
aice-fmt = 'fmt --all -- --check'
aice-clippy = 'clippy --workspace --all-targets -- -D warnings -D clippy::unwrap_used -D clippy::expect_used'
aice-audit = 'audit --deny warnings'
aice-test = 'test --workspace'
