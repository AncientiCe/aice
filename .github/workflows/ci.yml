name: CI

on:
  push:
    branches: [main, master, release/**]
  pull_request:
    branches: [main, master, release/**]

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git auth for private dependencies
        shell: bash
        env:
          AICE_SKILLS_READ_TOKEN: ${{ secrets.AICE_SKILLS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AICE_SKILLS_READ_TOKEN:-}" ]; then
            echo "Missing secret AICE_SKILLS_READ_TOKEN (must read AncientiCe/aice-skills)."
            exit 1
          fi
          git config --global --add url."https://x-access-token:${AICE_SKILLS_READ_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${AICE_SKILLS_READ_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::unwrap_used -D clippy::expect_used

      - name: Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings

      - name: Test
        run: cargo test --workspace

  backend-build-matrix:
    name: Build aice-backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure git auth for private dependencies
        shell: bash
        env:
          AICE_SKILLS_READ_TOKEN: ${{ secrets.AICE_SKILLS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AICE_SKILLS_READ_TOKEN:-}" ]; then
            echo "Missing secret AICE_SKILLS_READ_TOKEN (must read AncientiCe/aice-skills)."
            exit 1
          fi
          git config --global --add url."https://x-access-token:${AICE_SKILLS_READ_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${AICE_SKILLS_READ_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build aice-backend
        run: cargo build -p aice-backend
