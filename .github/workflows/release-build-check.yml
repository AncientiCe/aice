name: Release Build Check

on:
  push:
    branches: [main, master, release/**]
  pull_request:
    branches: [main, master, release/**]

jobs:
  release-build-macos-arm64:
    name: Release build (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binaries
        run: |
          cargo build --release -p aice-backend --bin aice-backend
          cargo build --release -p aice-hotels --bin aice-hotels
          cargo build --release -p aice-care --bin aice-care
          cargo build --release -p aice-ward --bin aice-ward
          cargo build --release -p pod-gateway --bin pod-gateway
