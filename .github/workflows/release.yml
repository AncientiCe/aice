name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag to release (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.flags.outputs.prerelease }}
    steps:
      - name: Validate release tag format
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.release_tag }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Invalid release_tag: $tag"
            echo "Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N"
            exit 1
          fi

      - name: Detect prerelease flag
        id: flags
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.release_tag }}"
          if [[ "$tag" == *"-rc."* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      # Release notes are this tag's CHANGELOG.md section, copied verbatim. Nothing is generated.
      - name: Extract this tag's CHANGELOG section
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.release_tag }}"
          tr -d '\r' < CHANGELOG.md \
            | awk -v t="$tag" 'index($0, "## [" t "]") == 1 {f=1; next} /^## \[/ {f=0} f' \
            > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$tag]' section; add it before tagging."
            exit 1
          fi

      - name: Keep release notes for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build-and-publish:
    name: Build and publish macOS arm64 assets
    needs: validate-tag
    runs-on: macos-14
    environment: release
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}
      - name: Verify checked out ref is tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git describe --tags --exact-match)"
          expected="${{ github.event.inputs.release_tag }}"
          if [[ "$tag" != "$expected" ]]; then
            echo "Checked out tag '$tag' does not match requested '$expected'"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit --deny warnings

      - name: Quality gates (debug)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
          cargo test --workspace

      - name: Quality gates (release mode)
        run: |
          cargo clippy --workspace --all-targets --release -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
          cargo test --workspace --release

      - name: Build release binaries
        run: |
          cargo build --release -p aice-backend --bin aice-backend
          cargo build --release -p aice-hotels --bin aice-hotels
          cargo build --release -p aice-care --bin aice-care
          cargo build --release -p aice-ward --bin aice-ward
          cargo build --release -p pod-gateway --bin pod-gateway
          cargo build --release -p room-loadtest --bin room-loadtest

      - name: Package release archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.release_tag }}"
          mkdir -p dist
          cp target/release/aice-backend target/release/aice-hotels target/release/aice-care target/release/aice-ward target/release/pod-gateway target/release/room-loadtest dist/
          archive="aice-${tag}-macos-arm64.tar.gz"
          tar -C dist -czf "dist/${archive}" aice-backend aice-hotels aice-care aice-ward pod-gateway room-loadtest
          (cd dist && shasum -a 256 "${archive}" > "${archive}.sha256")

      - name: Fetch release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.sha256

  build-and-publish-linux:
    name: Build and publish Linux ${{ matrix.arch }} assets
    needs: [validate-tag, build-and-publish]
    runs-on: ${{ matrix.runner }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: |
          cargo build --release -p aice-backend --bin aice-backend
          cargo build --release -p aice-hotels --bin aice-hotels
          cargo build --release -p aice-care --bin aice-care
          cargo build --release -p aice-ward --bin aice-ward
          cargo build --release -p pod-gateway --bin pod-gateway
          cargo build --release -p room-loadtest --bin room-loadtest

      - name: Package release archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.release_tag }}"
          mkdir -p dist
          cp target/release/aice-backend target/release/aice-hotels target/release/aice-care target/release/aice-ward target/release/pod-gateway target/release/room-loadtest dist/
          archive="aice-${tag}-linux-${{ matrix.arch }}.tar.gz"
          tar -C dist -czf "dist/${archive}" aice-backend aice-hotels aice-care aice-ward pod-gateway room-loadtest
          (cd dist && sha256sum "${archive}" > "${archive}.sha256")

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
