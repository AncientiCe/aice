name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag to release (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.flags.outputs.prerelease }}
    steps:
      - name: Validate release tag format
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.release_tag }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Invalid release_tag: $tag"
            echo "Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N"
            exit 1
          fi

      - name: Detect prerelease flag
        id: flags
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.release_tag }}"
          if [[ "$tag" == *"-rc."* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    name: Build and publish macOS arm64 assets
    needs: validate-tag
    runs-on: macos-14
    environment: release
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}
      - name: Configure git auth for private dependencies
        shell: bash
        env:
          AICE_SKILLS_READ_TOKEN: ${{ secrets.AICE_SKILLS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AICE_SKILLS_READ_TOKEN:-}" ]; then
            echo "Missing secret AICE_SKILLS_READ_TOKEN (must read AncientiCe/aice-skills)."
            exit 1
          fi
          git config --global --add url."https://x-access-token:${AICE_SKILLS_READ_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${AICE_SKILLS_READ_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Verify checked out ref is tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git describe --tags --exact-match)"
          expected="${{ github.event.inputs.release_tag }}"
          if [[ "$tag" != "$expected" ]]; then
            echo "Checked out tag '$tag' does not match requested '$expected'"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit --deny warnings

      - name: Quality gates (debug)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
          cargo test --workspace

      - name: Quality gates (release mode)
        run: |
          cargo clippy --workspace --all-targets --release -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
          cargo test --workspace --release

      - name: Build release binaries
        run: |
          cargo build --release -p aice-backend --bin aice-backend
          cargo build --release -p aice-hotels --bin aice-hotels
          cargo build --release -p aice-care --bin aice-care
          cargo build --release -p aice-ward --bin aice-ward
          cargo build --release -p pod-gateway --bin pod-gateway

      - name: Package release archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.release_tag }}"
          mkdir -p dist
          cp target/release/aice-backend target/release/aice-hotels target/release/aice-care target/release/aice-ward target/release/pod-gateway dist/
          archive="aice-${tag}-macos-arm64.tar.gz"
          tar -C dist -czf "dist/${archive}" aice-backend aice-hotels aice-care aice-ward pod-gateway
          shasum -a 256 "dist/${archive}" > "dist/${archive}.sha256"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256

  build-and-publish-linux:
    name: Build and publish Linux ${{ matrix.arch }} assets
    needs: [validate-tag, build-and-publish]
    runs-on: ${{ matrix.runner }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}
      - name: Configure git auth for private dependencies
        shell: bash
        env:
          AICE_SKILLS_READ_TOKEN: ${{ secrets.AICE_SKILLS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AICE_SKILLS_READ_TOKEN:-}" ]; then
            echo "Missing secret AICE_SKILLS_READ_TOKEN (must read AncientiCe/aice-skills)."
            exit 1
          fi
          git config --global --add url."https://x-access-token:${AICE_SKILLS_READ_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${AICE_SKILLS_READ_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: |
          cargo build --release -p aice-backend --bin aice-backend
          cargo build --release -p aice-hotels --bin aice-hotels
          cargo build --release -p aice-care --bin aice-care
          cargo build --release -p aice-ward --bin aice-ward
          cargo build --release -p pod-gateway --bin pod-gateway

      - name: Package release archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.release_tag }}"
          mkdir -p dist
          cp target/release/aice-backend target/release/aice-hotels target/release/aice-care target/release/aice-ward target/release/pod-gateway dist/
          archive="aice-${tag}-linux-${{ matrix.arch }}.tar.gz"
          tar -C dist -czf "dist/${archive}" aice-backend aice-hotels aice-care aice-ward pod-gateway
          sha256sum "dist/${archive}" > "dist/${archive}.sha256"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
