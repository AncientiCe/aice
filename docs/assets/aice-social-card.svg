<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B132B"/>
      <stop offset="1" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="panel" x1="220" y1="140" x2="1380" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#243B55" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#141E30" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00C9A7"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <style>
      .title { font-family: "Avenir Next", "Segoe UI", sans-serif; font-weight: 700; fill: #F8FAFC; }
      .subtitle { font-family: "Avenir Next", "Segoe UI", sans-serif; font-weight: 500; fill: #C7D2FE; }
      .label { font-family: "JetBrains Mono", "Menlo", monospace; font-size: 24px; fill: #E2E8F0; }
      .small { font-family: "JetBrains Mono", "Menlo", monospace; font-size: 20px; fill: #A5B4FC; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1430" cy="120" r="220" fill="#00E5FF" fill-opacity="0.08"/>
  <circle cx="150" cy="780" r="250" fill="#00C9A7" fill-opacity="0.08"/>

  <rect x="220" y="140" width="1160" height="620" rx="30" fill="url(#panel)" stroke="#334155" stroke-width="2"/>

  <text x="300" y="280" class="title" font-size="88">Aice</text>
  <text x="300" y="350" class="subtitle" font-size="46">Local-First Voice Assistant</text>
  <text x="300" y="402" class="small">private runtime • measurable latency • pluggable skills</text>

  <rect x="300" y="445" width="270" height="56" rx="28" fill="url(#accent)"/>
  <text x="347" y="480" class="label" font-size="24" fill="#06202A">open source</text>

  <g transform="translate(300 555)">
    <rect x="0" y="0" width="122" height="62" rx="12" fill="#1E293B" stroke="#475569"/>
    <text x="22" y="39" class="label">speech</text>

    <path d="M134 31H182" stroke="#00E5FF" stroke-width="4" stroke-linecap="round"/>
    <rect x="182" y="0" width="92" height="62" rx="12" fill="#1E293B" stroke="#475569"/>
    <text x="209" y="39" class="label">STT</text>

    <path d="M286 31H334" stroke="#00E5FF" stroke-width="4" stroke-linecap="round"/>
    <rect x="334" y="0" width="108" height="62" rx="12" fill="#1E293B" stroke="#475569"/>
    <text x="367" y="39" class="label">LLM</text>

    <path d="M454 31H502" stroke="#00E5FF" stroke-width="4" stroke-linecap="round"/>
    <rect x="502" y="0" width="92" height="62" rx="12" fill="#1E293B" stroke="#475569"/>
    <text x="527" y="39" class="label">TTS</text>

    <path d="M606 31H654" stroke="#00E5FF" stroke-width="4" stroke-linecap="round"/>
    <rect x="654" y="0" width="122" height="62" rx="12" fill="#1E293B" stroke="#475569"/>
    <text x="687" y="39" class="label">audio</text>
  </g>

  <text x="300" y="705" class="small">Rust • Ollama • Whisper • Piper • macOS arm64</text>
</svg>
